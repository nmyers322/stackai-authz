[project]
name = "stackai-authz"
version = "0.1.0"
requires-python = ">=3.13"
description = "Authorization service for organizations, teams, users, and workflows"

[tool.ruff]
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
